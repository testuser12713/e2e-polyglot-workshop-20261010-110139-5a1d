# Starts the two data stores this product needs, for a developer who cloned the
# repository. The office starts the same images itself; this file is only for a
# local machine.
#
#   cp .env.example .env      # fill in POSTGRES_PASSWORD and the secrets
#   docker compose up -d
#
# The database password is read from the environment — it is never written into
# this file. Set POSTGRES_PASSWORD in .env (see .env.example).
services:
  db:
    image: docker.io/library/postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    image: docker.io/valkey/valkey:9.1.2-trixie
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
